steps:
  - name: "python:3.12"
    id: install-dependencies
    entrypoint: /bin/bash
    args:
      - "-c"
      - |
        pip install uv==0.8.13 --user && uv sync --locked
    env:
      - "PATH=/usr/local/bin:/usr/bin:~/.local/bin"

  - name: "python:3.12"
    id: trigger-deployment
    entrypoint: /bin/bash
    args:
      - "-c"
      - |
        uv export --no-hashes --no-sources --no-header --no-dev --no-emit-project --no-annotate --locked > app/app_utils/.requirements.txt
        AGENT_RUNTIME_ENV="COMMIT_SHA=${COMMIT_SHA},LOGS_BUCKET_NAME=${_LOGS_BUCKET_NAME_PROD},GOOGLE_CLOUD_LOCATION=${_GEMINI_LOCATION},GRADR_GEMINI_MODEL_LOCATION=${_GEMINI_LOCATION},GOOGLE_GENAI_USE_VERTEXAI=${_GOOGLE_GENAI_USE_VERTEXAI},PIPELINE_TIMEOUT_SECONDS=${_PIPELINE_TIMEOUT_SECONDS},GRADR_LIGHTWEIGHT_GEMINI_MODEL=${_GRADR_LIGHTWEIGHT_GEMINI_MODEL},GRADR_ADVANCED_GEMINI_MODEL=${_GRADR_ADVANCED_GEMINI_MODEL}"
        uv run python -m app.app_utils.deploy \
          --project ${_PROD_PROJECT_ID} \
          --location ${_REGION} \
          --display-name=gradr-pbt-agent \
          --source-packages=./app \
          --entrypoint-module=app.agent_engine_app \
          --entrypoint-object=pbt_pipeline_engine \
          --requirements-file=app/app_utils/.requirements.txt \
          --service-account=${_APP_SERVICE_ACCOUNT_PROD} \
          --set-env-vars="${AGENT_RUNTIME_ENV}"
        uv run python -m app.app_utils.deploy \
          --project ${_PROD_PROJECT_ID} \
          --location ${_REGION} \
          --display-name=gradr-cbt-grading-agent \
          --source-packages=./app \
          --entrypoint-module=app.agent_engine_app \
          --entrypoint-object=cbt_grading_engine \
          --requirements-file=app/app_utils/.requirements.txt \
          --service-account=${_APP_SERVICE_ACCOUNT_PROD} \
          --set-env-vars="${AGENT_RUNTIME_ENV}"
        uv run python -m app.app_utils.deploy \
          --project ${_PROD_PROJECT_ID} \
          --location ${_REGION} \
          --display-name=gradr-cbt-exam-agent \
          --source-packages=./app \
          --entrypoint-module=app.agent_engine_app \
          --entrypoint-object=cbt_exam_engine \
          --requirements-file=app/app_utils/.requirements.txt \
          --service-account=${_APP_SERVICE_ACCOUNT_PROD} \
          --set-env-vars="${AGENT_RUNTIME_ENV}"
    env:
      - "PATH=/usr/local/bin:/usr/bin:~/.local/bin"

substitutions:
  _PROD_PROJECT_ID: YOUR_PROD_PROJECT_ID
  _REGION: us-central1
  _GEMINI_LOCATION: global
  _GOOGLE_GENAI_USE_VERTEXAI: "True"
  _PIPELINE_TIMEOUT_SECONDS: "900"
  _GRADR_LIGHTWEIGHT_GEMINI_MODEL: gemini-3.1-flash-lite
  _GRADR_ADVANCED_GEMINI_MODEL: gemini-3.5-flash-lite

logsBucket: gs://${PROJECT_ID}-gradr-agent-logs/build-logs
options:
  substitutionOption: ALLOW_LOOSE
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
